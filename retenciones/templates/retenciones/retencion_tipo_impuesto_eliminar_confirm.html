{% extends "base.html" %}
{% block content %}
<div class="col">
    <h4 class="mt-3 mb-3">Eliminar impuesto</h4>

    <div class="alert alert-danger">
        ¿Confirmás que querés eliminar el impuesto <strong>{{ impuesto.id }}</strong>
        - <strong>{{ impuesto.nombre }}</strong>?
        <br>
        Esta acción no se puede deshacer.
    </div>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'retenciones:tipo_impuesto_listado' %}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
