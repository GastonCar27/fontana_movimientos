{% extends "base.html" %}
{% block content %}
<div class="col">
    <h4 class="mt-3 mb-3">Eliminar empleado</h4>

    <div class="alert alert-danger">
        ¿Confirmás que querés eliminar a <strong>{{ empleado }}</strong>? Esta acción no se puede deshacer.
    </div>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-sm">Sí, eliminar</button>
        <a href="{% url 'empleados:listado' %}" class="btn btn-outline-secondary btn-sm">Cancelar</a>
    </form>
</div>
{% endblock %}
