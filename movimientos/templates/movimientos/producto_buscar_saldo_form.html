{% csrf_token %}
    {% for field in form %}
        {% if field.name != 'producto' %}
        {% if 'Selecciona' not in field.label_tag and 'Emisor' not in field.label_tag %}
        <p>
            {{ field.label_tag }}
        {% endif %}
            {{ field }}
        </p>
        {% endif %}
    {% endfor %}
    <p>
        <div class="buscador-wrapper">
            <input type="text" id="producto-buscador" autocomplete="off"
                   placeholder="Buscar producto por ID o nombre..." value="{{ producto_texto }}">
            {{ form.producto }}
            <div id="producto-resultados" class="buscador-resultados"></div>
        </div>
    </p>
<input type="submit" name="accion" value="Buscar" />
<input type="submit" name ="accion" value="Generar Excel" />
